<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
    :root {
        --bg: #04070a;
        --grid: rgba(43, 255, 136, 0.05);
        --neon: #2bff88;
        --neon-dim: rgba(43, 255, 136, 0.35);
        --amber: #ffc247;
        --red: #ff4d5e;
        --cyan: #4de3ff;
        --panel: rgba(8, 16, 14, 0.72);
        --line: rgba(43, 255, 136, 0.22);
        --text: #d8ffe9;
        --muted: #6f8f83;
        --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; min-height: 100vh;
        background-color: var(--bg);
        background-image:
            linear-gradient(var(--grid) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 34px 34px, 34px 34px;
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        padding: 14px 12px 60px;
        max-width: 1100px;
        margin: 0 auto;
    }
    .scanlines {
        position: fixed; inset: 0; pointer-events: none; z-index: 90;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.16) 2px 3px);
        mix-blend-mode: multiply;
    }

    /* ============ اتجاهات النصوص المختلطة (bidi) ============ */
    /* أي رمز لاتيني/حزمة/معرّف تيليجرام: يُعزل LTR فيبقى الرمز في بدايته دائماً */
    .tok { direction: ltr; unicode-bidi: isolate; text-align: left; }
    .auto { unicode-bidi: isolate; }

    header {
        display: flex; align-items: center; gap: 14px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(43,255,136,0.07), rgba(0,0,0,0.25));
        padding: 12px 14px; margin-bottom: 10px;
        position: relative; overflow: hidden;
    }
    header:before {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(43,255,136,0.12), transparent);
        animation: sweepX 5s linear infinite;
    }
    @keyframes sweepX { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .radar {
        width: 62px; height: 62px; flex: 0 0 62px; border-radius: 50%;
        border: 1px solid var(--neon-dim); position: relative; overflow: hidden;
        background: radial-gradient(circle, rgba(43,255,136,0.10) 0%, rgba(4,7,10,0.9) 70%);
        box-shadow: 0 0 18px rgba(43,255,136,0.25) inset;
    }
    .radar:before, .radar:after { content: ""; position: absolute; background: var(--neon-dim); }
    .radar:before { left: 50%; top: 0; width: 1px; height: 100%; }
    .radar:after { top: 50%; left: 0; height: 1px; width: 100%; }
    .sweep {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(43,255,136,0.55) 0deg, rgba(43,255,136,0) 70deg, rgba(43,255,136,0) 360deg);
        animation: spin 2.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip {
        position: absolute; width: 5px; height: 5px; border-radius: 50%;
        background: var(--neon); box-shadow: 0 0 8px var(--neon);
        animation: blip 2.6s linear infinite;
    }
    @keyframes blip { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    .brand { flex: 1 1 auto; min-width: 0; }
    .brand h1 {
        margin: 0; font-size: 1.32rem; letter-spacing: 1.5px; direction: ltr;
        unicode-bidi: isolate; color: #eafff3; text-shadow: 0 0 12px rgba(43,255,136,0.5);
    }
    .brand h1 em { font-style: normal; color: var(--neon); }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 0.76rem; }
    /* (v3.18) زر «تحديث» تحت العنوان مباشرةً — صف مستقل بعرض كامل */
    header { flex-wrap: wrap; }
    #btnRefresh { flex: 1 1 100%; }

    /* شريط اللغات */
    .langbar {
        display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .langbar button {
        flex: 1 1 auto; min-width: 74px; text-align: center;
        font-size: 0.74rem; padding: 7px 8px;
    }
    .langbar button.on { color: #04070a; background: var(--neon); font-weight: 700; border-color: var(--neon); }

    .panel {
        border: 1px solid var(--line); background: var(--panel);
        padding: 12px; margin-bottom: 12px;
    }
    .panel > h2 {
        margin: 0 0 10px; font-size: 0.82rem; letter-spacing: 1px;
        color: var(--neon); text-transform: uppercase;
        display: flex; align-items: center; gap: 8px;
    }
    .panel > h2:before { content: "▚"; color: var(--amber); }

    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
        border: 1px solid var(--line); background: rgba(4,7,10,0.6);
        padding: 10px; text-align: center;
    }
    .kpi b { display: block; font-size: 1.18rem; color: var(--neon); text-shadow: 0 0 10px rgba(43,255,136,0.4); }

try {
    var _sv = localStorage.getItem(LANG_KEY);

} catch (e) {}

function t(key) {
    var d = I18N[lang] || I18N.ar;
    if (d[key] !== undefined) return d[key];
    if (I18N.en[key] !== undefined) return I18N.en[key];
    return key;
}

function tf(key, map) {
    var s = t(key);
    for (var k in map) {
        if (Object.prototype.hasOwnProperty.call(map, k)) {
            s = s.split('{' + k + '}').join(map[k]);
        }
    }
    return s;
}

function nameOf(pkg) {
    var per = LANG_NAMES[lang] || LANG_NAMES.ar;
    if (per[pkg]) return per[pkg];
    if (INTL_NAMES[pkg]) return INTL_NAMES[pkg];
    if (LANG_NAMES.ar[pkg]) return LANG_NAMES.ar[pkg];

    var low = String(pkg).toLowerCase();
    for (var i = 0; i < BANK_WORDS.length; i++) {
        if (low.indexOf(BANK_WORDS[i]) !== -1) return per.catBank;
    }
    if (low.indexOf('nubia') !== -1) return per.catNubia;
    if (low.indexOf('com.zte') === 0) return per.catZte;
    if (low.indexOf('oneplus') !== -1 || low.indexOf('oplus') !== -1) return per.catOneplus;
    if (low.indexOf('com.google.') === 0) return per.catGoogle;
    if (low.indexOf('com.samsung') === 0) return per.catSamsung;
    if (low.indexOf('com.xiaomi') === 0 || low.indexOf('com.miui') === 0) return per.catXiaomi;
    if (low.indexOf('com.android.') === 0) return per.catAndroid;
    return '';
}

}

function wrap(cmd, secs) {

}

/* ============ دعوة الجسر — تدعم طريقتين ============
   1) KsuWebUI Standalone / MMRL:  ksu.exec(cmd, opts, "اسم_دالة_عامة")
   2) KernelSU الأصلي:             ksu.exec(cmd, opts, function)
   الإضافة الرسمية لـ TrickyStore تستخدم الطريقة (1)، وكانت واجهتنا تستخدم (2) فقط
   ⇒ الجسر لم يكن يعمل إطلاقاً على أجهزة المستخدمين (لا استجابة ولا خطأ). */
var BRIDGE_MODE = '';
var CB_SEQ = 0;

function bridgeCall(cmd, onDone) {
    var name = '__falcon_cb_' + (++CB_SEQ);
    var settled = false;
    function finish(ec, out, err) {
        if (settled) return;
        settled = true;
        try { delete window[name]; } catch (e) {}
        onDone(ec, out, err);
    }
    window[name] = function (ec, out, err) { finish(ec, out, err); };
    var fn = function (ec, out, err) { finish(ec, out, err); };

    var ksuObj = null;
    try { if (typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function') ksuObj = ksu; } catch (e) {}

    if (ksuObj) {
        if (BRIDGE_MODE === 'fn') {
            try { ksuObj.exec(cmd, '{}', fn); } catch (e) {}
            return;
        }
        try {
            var ret = ksuObj.exec(cmd, '{}', name);
            if (ret && typeof ret.then === 'function') {
                ret.then(function (res) { if (res) finish(res.errno, res.stdout, res.stderr); });
            }
        } catch (e) {
            try { ksuObj.exec(cmd, '{}', fn); } catch (e2) {}
        }
        return;
    }

    try {
        if (typeof kernelsu !== 'undefined' && kernelsu && typeof kernelsu.exec === 'function') {
            return kernelsu.exec(cmd, fn);
        }
    } catch (e) {}
    try {
        if (typeof shell === 'function') {
            return shell(cmd, { root: true }, function (r) {
                var txt = (typeof r === 'string') ? r : (r && (r.stdout || r.out || r.result)) || '';
                finish(0, txt);
            });
        }
    } catch (e) {}
    try {
        if (typeof exec === 'function') { return exec(cmd, fn); }
    } catch (e) {}
    finish(-1, '', 'no exec bridge');
}

/* فحص سريع لطريقة الجسر (أمر لا ضرر منه) ثم نبدأ التحميل */
function probeBridge(cb) {
    var done = false;
    function finish(mode) { if (done) return; done = true; BRIDGE_MODE = mode; cb(mode); }
    var name = '__falcon_probe';
    window[name] = function (ec, out, err) {
        if (String(out).indexOf('FALCON_PROBE_OK') !== -1) finish('name');
    };
    try {
        var ret = ksu.exec('echo FALCON_PROBE_OK', '{}', name);
        if (ret && typeof ret.then === 'function') {
            ret.then(function (res) { if (res && String(res.stdout).indexOf('FALCON_PROBE_OK') !== -1) finish('promise'); });
        }
    } catch (e) {}
    setTimeout(function () { finish('fn'); }, 2500);
}

function sh(cmd, cb, secs, bg) {
    // bg = true ⇒ عملية خلفية: لا تُقفل الواجهة ولا تُعطّل الأزرار
    if (!bg && (busy || LIVE_RUNNING)) { toast(t('logRefused')); return; }
    if (!bg) { busy = true; setBusy(true); }
    var limit = secs || TIMEOUT;
    var wrapped = wrap(cmd, limit);
    var finished = false;
    var watchdog = setTimeout(function () {
        if (finished) return;
        finished = true;
        if (!bg) { busy = false; setBusy(false); }
        logLine(tf('logTimeout', { a: limit }));
        cb(-1, '__TIMEOUT__');
    }, limit * 1000 + 15000);

    function done(errno, out, err) {
        if (finished) return;
        finished = true;
        clearTimeout(watchdog);
        if (!bg) { busy = false; setBusy(false); }
        cb(errno, (out || '') + (err ? ('\n' + err) : ''));
    }

    bridgeCall(wrapped, done);
}

function parseSections(out) {
    var secs = {};
    var cur = null;
    var lines = String(out).split('\n');
    for (var i = 0; i < lines.length; i++) {
        var m = /^###(\S+)\s*$/.exec(lines[i]);
        if (m) { cur = m[1]; secs[cur] = []; continue; }
        if (cur) secs[cur].push(lines[i]);
    }
    return secs;
}

function cleanLines(arr) {
    var res = [];
    (arr || []).forEach(function (l) {
        var v = String(l).replace(/\r/g, '').trim();
        if (!v) return;
        if (v.charAt(0) === '#') return;
        if (res.indexOf(v) === -1) res.push(v);
    });
    return res;
}

function readCore(cb) {

        'echo "###E"; if pidof TrickyStoreOSS >/dev/null 2>&1; then echo RUNNING; else echo STOPPED; fi',
        'echo "###P"; cat /data/adb/tricky_store/security_patch.txt 2>/dev/null',

        'echo "###V"; grep -m1 "^version=" /data/adb/modules/falcon_tricky/module.prop 2>/dev/null'
    ].join('; ');

    sh(cmd, function (ec, out) {
        if (out === '__TIMEOUT__') { logLine(tf('logTimeout', { a: 30 })); if (cb) cb(false); return; }
        var s = parseSections(out);
        state.target = cleanLines(s.T);

        var k = (s.K || []).join('\n');
        var mSize = /SIZE=(\d+)/.exec(k);
        var mCert = /CERTS=(\d+)/.exec(k);
        var mSrc = /SRC=([A-Z]+)/.exec(k);
        state.keybox = {
            size: mSize ? parseInt(mSize[1], 10) : 0,
            certs: mCert ? parseInt(mCert[1], 10) : 0,
            src: mSrc ? mSrc[1] : 'NONE'
        };
        state.engine = ((s.E || []).join('').indexOf('RUNNING') !== -1) ? 'RUNNING' : 'STOPPED';
        state.patch = (s.P || []).join(' ').trim();
        state.auto = ((s.A || []).join('').trim() === 'off') ? 'off' : 'on';
        state.ver = (s.V || []).join('').replace('version=', '').trim();

        var fileLang = (s.L || []).join('').trim();
        if (!hadStoredLang && I18N[fileLang] && fileLang !== lang) {
            lang = fileLang;
            applyStatic();
        }

        state.loaded = true;
        setCfgStatus('saved');
        var st = (state.engine === 'RUNNING') ? t('stRun') : t('stStop');
        logLine(tf('logRead', { a: state.target.length, b: state.all.length, c: st }));
        if (state.patch) logLine(tf('logPatch', { a: tok(state.patch) }));
        logLine(tf('logKeybox', { a: tok(state.keybox.src), b: state.keybox.size, c: state.keybox.certs }));
        if (cb) cb(true);
    }, 30);
}

/* قائمة التطبيقات: من الذاكرة المؤقتة أولاً (لحظي)، ثم تحديث من الجهاز في الخلفية.
   bg=true ⇒ لا تُقفل الواجهة مهما طال الأمر. */
function loadPackages() {
    // (v3.14) القراءة من الذاكرة المؤقتة فوراً (لحظي)، ثم تحديث صامت من الجهاز
    // بعد مهلة قصيرة — حتى لا يزاحم الجسر أول تفاعل من المستخدم.
    sh('export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'echo "###C"; cat ' + PKG_CACHE + ' 2>/dev/null; echo "###CU"; cat ' + PKG_CACHE_USER + ' 2>/dev/null',
        function (ec, out) {
            if (out === '__TIMEOUT__') return;
            var s = parseSections(out);
            var cachedAll = cleanLines(s.C);
            var cachedUser = cleanLines(s.CU);
            if (cachedAll.length) {
                state.all = cachedAll;
                state.user = cachedUser;
                if (state.loaded) render();
                logLine(t('logCacheUsed'));
            }
            // بلا ذاكرة مؤقتة ⇒ حدّث فوراً. ومعها ⇒ انتظر 8 ثوانٍ ثم حدّث بصمت.
            setTimeout(refreshPkgList, cachedAll.length ? 8000 : 0);
        }, 20, true);
}

/* تحديث قائمة التطبيقات من الجهاز (في الخلفية — لا يقفل الواجهة) */
function refreshPkgList() {
    var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'echo "###J"; L=$(timeout 12 pm list packages 2>/dev/null | cut -d: -f2); if [ -z "$L" ]; then L=$(cut -d" " -f1 /data/system/packages.list 2>/dev/null); fi; echo "$L"; '
        + 'echo "###U"; U=$(timeout 12 pm list packages -3 2>/dev/null | cut -d: -f2); if [ -z "$U" ]; then U=$(awk \'$2>=10000{print $1}\' /data/system/packages.list 2>/dev/null); fi; echo "$U"';
    sh(cmd, function (ec2, out2) {
        if (out2 === '__TIMEOUT__') return;
        var s2 = parseSections(out2);
        var all = cleanLines(s2.J);
        var user = cleanLines(s2.U);
        if (!all.length) return;
        state.all = all;
        state.user = user;
        writePkgCache(all, user);
        if (state.loaded) render();
        logLine(tf('logPkgLoaded', { a: all.length }));
    }, 20, true);
}

function writePkgCache(all, user) {
    var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'printf "%s\\n" ' + all.map(function (p) { return "'" + p + "'"; }).join(' ') + ' > ' + PKG_CACHE + '; '
        + 'printf "%s\\n" ' + (user.length ? user.map(function (p) { return "'" + p + "'"; }).join(' ') : "''") + ' > ' + PKG_CACHE_USER + '; '
        + 'chmod 644 ' + PKG_CACHE + ' ' + PKG_CACHE_USER + ' 2>/dev/null; echo CACHE_OK';
    sh(cmd, function () {}, 30, true);
}

/* تحديث كامل (زر ⟳) — يعيد قراءة النواة + قائمة التطبيقات من الجهاز */
function readState(cb) {
    readCore(function (ok) {
        if (!ok) { if (cb) cb(false); return; }
        var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
            + 'echo "###J"; L=$(timeout 15 pm list packages 2>/dev/null | cut -d: -f2); if [ -z "$L" ]; then L=$(cut -d" " -f1 /data/system/packages.list 2>/dev/null); fi; echo "$L"; '
            + 'echo "###U"; U=$(timeout 15 pm list packages -3 2>/dev/null | cut -d: -f2); if [ -z "$U" ]; then U=$(awk \'$2>=10000{print $1}\' /data/system/packages.list 2>/dev/null); fi; echo "$U"';
        sh(cmd, function (ec, out) {
            if (out === '__TIMEOUT__') { render(); if (cb) cb(true); return; }
            var s = parseSections(out);
            var all = cleanLines(s.J);
            var user = cleanLines(s.U);
            if (all.length) {
                state.all = all;
                state.user = user;
                writePkgCache(all, user);
            }
            render();
            loadIconIndex();
            if (cb) cb(true);
        }, 25);
    });
}

/* ------------------------------ الكتابة ------------------------------ */
function saveTarget(list, note, cb, verifyPkg) {
    if (!bridgeAvailable()) { toast(t('logDemoAction')); return; }
    var prev = {};
    state.target.forEach(function (l) { prev[stripBang(l)] = true; });

    var out = [];
    MANDATORY.forEach(function (m) { if (out.indexOf(m) === -1) out.push(m); });
    (list || []).forEach(function (p) {
        if (!/^[A-Za-z0-9._]+!?$/.test(p)) { logLine(tf('logBadEntry', { a: esc(p) })); return; }
        if (out.indexOf(p) === -1) out.push(p);
    });
    if (!out.length) { toast(t('logEmptyRefuse')); return; }

    // (v3.14) تحديث الواجهة فوراً بلا أي انتظار — التطبيق يُخفى أمام عينك
    // لحظياً، والكتابة تجري في الخلف. ولهذا لا نستدعي readState بعد الحفظ
    // (كان ينفّذ pm list packages فيقفل الواجهة عشر ثوانٍ مع كل ضغطة).
    var added = out.filter(function (p) {
        var b = stripBang(p);
        return !prev[b] && MANDATORY.indexOf(b) === -1;
    });
    state.target = out.slice();
    render();

    var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; mkdir -p /data/adb/tricky_store; chmod 755 /data/adb/tricky_store 2>/dev/null; '
        + 'printf "%s\\n" ' + out.map(function (p) { return "'" + p + "'"; }).join(' ') + ' > ' + TARGET_FILE + '; '
        + 'chmod 644 ' + TARGET_FILE + ' 2>/dev/null; chown root:root ' + TARGET_FILE + ' 2>/dev/null; sync; '
        + 'echo "SAVED_COUNT=' + out.length + '"; echo "READBACK_COUNT=$(grep -c . ' + TARGET_FILE + ' 2>/dev/null)"; echo "WRITE_DONE"'
        // (v3.09) تحقّق مؤكد من تثبيت الحزمة عبر pm path — القائمة العامة قد تكون
        // ناقصة فنُخطئ ونقول «غير مثبتة» بينما هي مثبتة فعلاً.
        + (verifyPkg ? '; if timeout 25 pm path ' + verifyPkg + ' >/dev/null 2>&1; then echo "PKG_INSTALLED=yes"; else echo "PKG_INSTALLED=no"; fi' : '');

    logLine(tf('logWrite', { a: out.length }));
    sh(cmd, function (ec, otp) {
        if (otp === '__TIMEOUT__') { toast(t('logSaveFail')); return; }
        var txt = String(otp);
        if (txt.indexOf('WRITE_DONE') === -1) {
            toast(t('logSaveFail'));
            logLine(esc(txt.slice(0, 400) || '(no output)'));
            readCore(function () { render(); });   // إعادة مزامنة سريعة من القرص
            return;
        }
        var rb = /READBACK_COUNT=(\d+)/.exec(txt);
        var back = rb ? parseInt(rb[1], 10) : -1;
        if (back !== out.length) {
            logLine(tf('logWriteMismatch', { a: out.length, b: back }));
            toast(t('logSaveFail'));
        } else {
            logLine(tf('logVerified', { a: back }));
            if (verifyPkg) {
                logLine(/PKG_INSTALLED=yes/.test(txt)
                    ? tf('logInstalledOk', { a: tok(verifyPkg) })
                    : tf('logNotInstalled', { a: tok(verifyPkg) }));
            }
            toast(tf('logSaved', { a: out.length }) + (note ? ' · ' + note : ''));
        }
        // (v3.14) أيقونات التطبيقات التي أخفيناها للتوّ فقط — منفصلة تماماً عن
        // الجسر (تسحب نفسها في الخلفية) فلا تعلّق الواجهة ولا تنتظر شيئاً.
        if (added.length) extractIconsDetached(added);
        if (cb) cb();
    }, 30);
}

function toggleHidden(pkg) {
    pkg = stripBang(pkg);
    if (MANDATORY.indexOf(pkg) !== -1) { toast(t('logMustLocked')); return; }
    var list = state.target.slice();
    var i = list.indexOf(pkg);
    if (i !== -1) {
        list.splice(i, 1);
        saveTarget(list, tf('logShown', { a: tok(pkg) }));
    } else {
        list.push(pkg);
        saveTarget(list, tf('logHidden', { a: tok(pkg) }));
    }
}

function essentialOnly() {
    confirmAction(t('confirmEssential'), function () {
        saveTarget(MANDATORY.slice(), t('logEssential'));
    });
}

/* =============================================================================
   (v3.14) التحديد الجماعي: «تحديد الكل» و«إلغاء الكل» بضغطة واحدة
   -----------------------------------------------------------------------------
   يعملان على ما يراه المستخدم بالضبط في هذه اللحظة (نفس التصفية ونفس البحث)،
   والحزم الثلاث الإلزامية محميّة دائماً ولا تُلمس.
   ============================================================================= */
function selTargets() {
    var rows = state.rows || [];
    var hide = [], show = [];
    rows.forEach(function (r) {
        var p = stripBang(r.pkg);
        if (MANDATORY.indexOf(p) !== -1) return;
        if (r.hidden && !r.bang) show.push(p);   // مخفي ⇒ يمكن إظهاره
        else hide.push(p);                        // ظاهر أو مستثنى ⇒ يمكن إخفاؤه
    });
    return { hide: hide, show: show };
}

function renderSelBar() {
    var el = $('selCount');
    var b1 = $('btnSelAll');
    var b2 = $('btnSelNone');
    if (!b1 || !b2 || !el) return;
    var g = selTargets();
    b1.disabled = (g.hide.length === 0);
    b2.disabled = (g.show.length === 0);
    el.textContent = tf('selBarCount', { a: g.hide.length, b: g.show.length });
}

function selectAll(on) {
    var g = selTargets();
    var list = state.target.slice();
    var changed = 0;
    if (on) {
        g.hide.forEach(function (p) {
            var bi = list.indexOf(p + '!');
            if (bi !== -1) list.splice(bi, 1);
            if (list.indexOf(p) === -1) { list.push(p); changed++; }
            else if (bi !== -1) changed++;
        });
    } else {
        g.show.forEach(function (p) {
            var i = list.indexOf(p);
            if (i !== -1) { list.splice(i, 1); changed++; }
        });
    }
    if (!changed) { toast(t('selNothing')); return; }
    confirmAction(tf(on ? 'confirmSelAll' : 'confirmSelNone', { a: changed }), function () {
        saveTarget(list, tf(on ? 'logSelAll' : 'logSelNone', { a: changed }));
    });
}

function setCfgStatus(kind) {
    var el = $('cfgStatus');
    if (!el) return;
    el.className = 'hint ' + (kind === 'saved' ? 'okmark' : (kind === 'dirty' ? 'warnmark' : 'badmark'));
    el.textContent = kind === 'saved' ? t('cfgSaved') : (kind === 'dirty' ? t('cfgDirty') : t('cfgFail'));
}

/* (v3.08) حفظ الإعدادات في الذاكرة الدائمة + قراءة راجعة للتحقق
   السبب: المستخدم أبلغ أن تفعيل «إخفاء التطبيقات الجديدة» لا يبقى محفوظاً
   بعد الخروج من الواجهة. الآن لا نُظهر «تم الحفظ» إلا بعد التأكد من الملف فعلياً. */
function saveCfg() {
    if (!bridgeAvailable()) { toast(t('logDemoAction')); setCfgStatus('dirty'); return; }
    var on = $('chkAuto').checked;
    var flag = '/data/adb/falcon/auto_hide_new';

    var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; mkdir -p /data/adb/falcon; '
        + (on ? 'rm -f ' + flag : 'echo off > ' + flag) + '; '
        + 'printf "%s\\n" ' + "'" + lang + "'" + ' > ' + LANG_FILE + ' 2>/dev/null; sync; '
        + 'if [ -f ' + flag + ' ] && [ "$(cat ' + flag + ' 2>/dev/null)" = "off" ]; then echo "CFG_AUTO=off"; else echo "CFG_AUTO=on"; fi'
        + '; echo "CFG_LANG=$(cat ' + LANG_FILE + ' 2>/dev/null)"'
        + '; echo "CFG_DONE"';

    logLine(t('logCfgWrite'));
    sh(cmd, function (ec, out) {
        if (out === '__TIMEOUT__') { setCfgStatus('fail'); toast(t('logCfgFail')); return; }
        var txt = String(out);
        var mA = /CFG_AUTO=(on|off)/.exec(txt);
        var got = mA ? mA[1] : '';
        var want = on ? 'on' : 'off';
        if (txt.indexOf('CFG_DONE') === -1 || got !== want) {
            setCfgStatus('fail');
            toast(t('logCfgFail'));
            logLine(esc(txt.slice(0, 400) || '(no output)'));
            return;
        }
        state.auto = want;
        $('chkAuto').checked = on;
        setCfgStatus('saved');
        logLine(t('logCfgSaved'));
        logLine(on ? t('logAutoOn') : t('logAutoOff'));
        toast(t('logCfgSaved'));
        readState(function () { render(); });
    }, 25);
}

/* (v3.09) تصفير المراقبة: يجعل كل التطبيقات الحالية «أساساً» حتى لا يُخفَى
   إلا ما يُثبَّت لاحقاً — يحل لبس «التطبيقات المثبتة لم تُخفَ». */
function resetBaseline() {
    confirmAction(t('confirmBaseline'), function () {
        if (!bridgeAvailable()) { toast(t('logDemoAction')); return; }
        var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; mkdir -p /data/adb/falcon; '
            + 'timeout 25 pm list packages 2>/dev/null | cut -d: -f2 | sort -u > /data/adb/falcon_known_packages.txt; '
            + 'echo "BASELINE_COUNT=$(grep -c . /data/adb/falcon_known_packages.txt 2>/dev/null)"; echo BASELINE_DONE';
        logLine(t('logBaselineWrite'));
        sh(cmd, function (ec, out) {
            if (out === '__TIMEOUT__') { toast(t('logBaselineFail')); return; }
            var txt = String(out);
            if (txt.indexOf('BASELINE_DONE') === -1) { toast(t('logBaselineFail')); logLine(esc(txt.slice(0, 300))); return; }
            var m = /BASELINE_COUNT=(\d+)/.exec(txt);
            var n = m ? m[1] : '0';
            toast(tf('logBaselineDone', { a: n }));
            logLine(tf('logBaselineDone', { a: n }));
        }, 35);
    });
}

/* (v3.09) قراءة سجل الإخفاء التلقائي من الجهاز — إثبات للمستخدم أن الخيار يعمل */
function readAutoLog() {
    if (!bridgeAvailable()) { toast(t('logDemoAction')); return; }
    logLine(t('logAutoLogHead'));
    sh('export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'echo "=== AUTO LOG START ==="; tail -n 120 /data/adb/falcon/auto_hide.log 2>/dev/null; echo "=== AUTO LOG END ==="',
        function (ec, out) {
            if (out === '__TIMEOUT__') { logLine(tf('logTimeout', { a: 30 })); return; }
            var lines = String(out).split('\n');
            var any = false;
            for (var i = 0; i < lines.length; i++) {
                var l = lines[i].replace(/\r/g, '');
                if (!l) continue;
                if (l.indexOf('=== AUTO LOG') !== -1) continue;
                logLine(tok(l));
                any = true;
            }
            if (!any) logLine(t('logAutoLogEmpty'));
        }, 30);
}

function addPkg() {
    var v = $('pkgInput').value.trim();
    if (!/^[A-Za-z0-9._]+$/.test(v)) { toast(t('logInvalidPkg')); return; }
    if (MANDATORY.indexOf(v) !== -1 || state.target.indexOf(v) !== -1) {
        toast(tf('logDup', { a: tok(v) }));
        state.filter = 'hidden';
        var qel = $('q');
        qel.value = v;
        render();
        return;
    }
    var list = state.target.slice();
    list.push(v);
    $('pkgInput').value = '';
    // (v3.09) التحقق من التثبيت يتم عبر pm path داخل أمر الحفظ نفسه، لأن قائمة
    // الحزم العامة قد تكون ناقصة فكنّا نُخطئ ونقول «غير مثبتة» وهي مثبتة فعلاً.
    saveTarget(list, tf('logAdded', { a: tok(v) }), null, v);
}

/* فحص تشخيصي شامل — يكشف سبب عدم عمل أي زر على أجهزة المستخدمين */
function diagnose() {
    if (!bridgeAvailable()) {
        logLine(t('logDemoAction'));
        updateBridgeTag();
        return;
    }
    var cmd = [
        'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH',
        'echo "=== DIAG START ==="',
        'echo "BRIDGE=' + bridgeName() + '"',
        'echo "UID=$(id -u 2>/dev/null) USER=$(id -un 2>/dev/null)"',
        'echo "CTX=$(cat /proc/self/attr/current 2>/dev/null)"',
        'echo "TIMEOUT=$(command -v timeout 2>/dev/null || echo NONE)"',
        'echo "TARGET_EXISTS=$([ -f ' + TARGET_FILE + ' ] && echo yes || echo no)"',
        'echo "TARGET_LINES=$(grep -c . ' + TARGET_FILE + ' 2>/dev/null)"',
        'echo "TARGET_PERM=$(ls -l ' + TARGET_FILE + ' 2>&1)"',
        'echo "TRICKY_DIR=$([ -d /data/adb/tricky_store ] && echo yes || echo no)"',
        'echo "PM_ALL=$(timeout 25 pm list packages 2>/dev/null | wc -l)"',
        'echo "PM_USER=$(timeout 25 pm list packages -3 2>/dev/null | wc -l)"',
        'echo "ENGINE=$(pidof TrickyStoreOSS >/dev/null 2>&1 && echo RUNNING || echo STOPPED)"',
        'echo "KEYBOX=$(wc -c < ' + KEYBOX_FILE + ' 2>/dev/null || echo 0)"',
        'if echo diag > /data/adb/tricky_store/.falcon_diag 2>/dev/null; then echo "WRITE_TEST=ok"; else echo "WRITE_TEST=fail"; fi',
        'rm -f /data/adb/tricky_store/.falcon_diag 2>/dev/null',
        'echo "=== DIAG END ==="'
    ].join('; ');

    logLine('🩺 …');
    sh(cmd, function (ec, out) {
        if (out === '__TIMEOUT__') { logLine(tf('logTimeout', { a: 45 })); return; }
        var lines = String(out).split('\n');
        for (var i = 0; i < lines.length; i++) {
            var l = lines[i].replace(/\r/g, '');
            if (!l) continue;
            logLine(tok(l));
        }
        logLine(t('logDiagDone'));
        updateBridgeTag();
    }, 45);
}

function copyLog() {
    var box = $('log');
    var rows = box.querySelectorAll('.logrow');
    var txt = '';
    for (var i = 0; i < rows.length; i++) {
        var ts = rows[i].querySelector('.ts');
        var msg = rows[i].querySelector('.msg');
        txt += (ts ? ts.textContent : '') + '  ' + (msg ? msg.textContent : '') + '\n';
    }
    var area = $('logArea');
    area.value = txt || '(empty)';
    $('logOverlay').className = 'on';
    area.focus();
    area.select();
    try { area.setSelectionRange(0, area.value.length); } catch (e) {}
}

function closeLog() { $('logOverlay').className = ''; }

/* (v3.11) استيراد كيبوكس من أي مكان على الجهاز — ينهي نهائياً مشكلة
   «الكيبوكس يبقى في الإضافة ولا يصل إلى TrickyStore». */
function importKeybox() {
    if (!bridgeAvailable()) { toast(t('logDemoAction')); return; }
    logLine(t('logKeyboxScanHead'));
    var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'F=""; '
        + 'for C in /data/adb/modules/*/keybox.xml /data/adb/modules/*/*/keybox.xml /data/adb/modules/*/*/*/keybox.xml '
        + '/data/adb/modules_update/*/keybox.xml /data/adb/modules_update/*/*/keybox.xml '
        + '/data/misc/keybox/keybox.xml /data/misc/keybox/keybox.xml '
        + '/sdcard/Download/keybox.xml /sdcard/Download/*.xml '
        + '/storage/emulated/0/Download/keybox.xml /storage/emulated/0/Download/*.xml '
        + '/data/adb/tricky_store/keybox.xml; do '
        + '  if [ -z "$F" ] && [ -s "$C" ] && grep -q "<AndroidAttestation" "$C" 2>/dev/null; then '
        + '    case "$C" in /data/adb/modules/playintegrityfix/*|/data/adb/modules_update/playintegrityfix/*|/data/adb/modules/falcon_tricky/*|/data/adb/modules_update/falcon_tricky/*) ;; *) F="$C";; esac; '
        + '  fi; '
        + 'done; '
        + 'if [ -n "$F" ]; then '
        + '  mkdir -p /data/adb/tricky_store /data/adb/falcon; '
        + '  cp -f "$F" /data/adb/tricky_store/keybox.xml; cp -f "$F" /data/adb/falcon/keybox.xml; '
        + '  chmod 644 /data/adb/tricky_store/keybox.xml 2>/dev/null; chmod 600 /data/adb/falcon/keybox.xml 2>/dev/null; '
        + '  chown root:root /data/adb/tricky_store/keybox.xml /data/adb/falcon/keybox.xml 2>/dev/null; sync; '
        + '  echo "KEYBOX_SRC=$F"; echo KEYBOX_DONE; '
        + 'else echo KEYBOX_NONE; fi';
    sh(cmd, function (ec, out) {

/* (v3.16) مشغّل عام بسجل حي (ES5): يشغّل أمراً طويلاً في الخلفية ويعرض سطوره لحظياً

var LIVE_RUNNING = false;
function shLive(headMsg, cmd, logPath, onDone) {
    if (busy || LIVE_RUNNING) { toast(t('logRefused')); return; }
    LIVE_RUNNING = true;
    var LOGF = logPath || '/data/adb/falcon/live_op.log';
    logLine(headMsg);
    function liveFinish(out, code) {
        LIVE_RUNNING = false;
        if (onDone) onDone(out, code);
    }
    sh('mkdir -p /data/adb/falcon; rm -f ' + LOGF + '; ( ' + cmd + ' > ' + LOGF + ' 2>&1; echo FALCON_EXIT=$? >> ' + LOGF + ' ) < /dev/null >/dev/null 2>&1 & echo FALCON_STARTED', function (ec0, out0) {
        if (String(out0 || '').indexOf('FALCON_STARTED') === -1) {
            LIVE_RUNNING = false;
            logLine(t('logSaveFail'));
            if (onDone) onDone('', -1);
            return;
        }
        var shown = 0, ticks = 0, misses = 0;
        function shLiveNext() {
            ticks++;
            if (ticks > 240) { LIVE_RUNNING = false; logLine(tf('logTimeout', { a: 600 })); return; }
            setTimeout(shLivePoll, 2500);
        }
        function shLivePoll() {
            sh('cat ' + LOGF + ' 2>/dev/null', function (ec2, out2) {
                if (out2 === '__TIMEOUT__') {
                    misses++;
                    if (misses >= 2) { LIVE_RUNNING = false; logLine(t('logBridgeLost')); return; }
                    shLiveNext(); return;
                }
                misses = 0;
                var o2 = String(out2 || '');
                var cut = o2.lastIndexOf('\n');
                if (cut >= 0 && cut + 1 > shown) {
                    var chunk = o2.substring(shown, cut + 1).replace(/\n+$/, '');
                    var cls = chunk.split('\n');
                    for (var ci = 0; ci < cls.length; ci++) {
                        var ln = cls[ci].replace(/\r$/, '');
                        if (!ln.replace(/\s/g, '')) continue;
                        logLine(ln.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
                    }
                    shown = cut + 1;
                }
                if (o2.indexOf('FALCON_EXIT=') !== -1) {
                    var em = /FALCON_EXIT=([0-9-]+)/.exec(o2);
                    liveFinish(o2, em ? parseInt(em[1], 10) : -1);
                    return;
                }
                shLiveNext();
            }, 15, true);
        }
        setTimeout(shLivePoll, 1500);
    }, 15, true);
}

function appRow(pkg, hidden, banged) {
    var must = MANDATORY.indexOf(pkg) !== -1;
    var inst = installedMap && installedMap[pkg];
    var partOf = false;
    if (!inst && pkg.indexOf('.unstable') !== -1) {
        var base = pkg.replace('.unstable', '');
        if (installedMap && installedMap[base]) { inst = true; partOf = true; }
    }
    var nice = nameOf(pkg);

    var tags = '';
    if (must) tags += '<span class="tag must">' + esc(t('tagMust')) + '</span>';
    if (banged) tags += '<span class="tag bang">' + esc(t('tagBang')) + '</span>';
    if (inst) {
        var cls = partOf ? 'sys' : (isUser(pkg) ? 'user' : 'sys');
        var lbl = partOf ? t('tagSub') : (isUser(pkg) ? t('tagUser') : t('tagSys'));
        tags += '<span class="tag ' + cls + '">' + esc(lbl) + '</span>';
    } else {
        tags += '<span class="tag gone">' + esc(t('tagGone')) + '</span>';
    }

    var btn;
    if (must) {
        btn = '<button class="ghost" disabled>🔒</button>';
    } else if (hidden) {
        btn = '<button class="danger" onclick="toggleHidden(\'' + pkg + '\')">' + esc(t('btnUnhide')) + '</button>';
    } else {
        btn = '<button onclick="toggleHidden(\'' + pkg + '\')">' + esc(t('btnHide')) + '</button>';
    }

    var stopBtn = (inst && !must)
        ? '<button class="ghost" onclick="forceStop(\'' + pkg + '\')">' + esc(t('btnStop')) + '</button>'
        : '';

    return '<div class="item' + (hidden ? ' hidden' : '') + (must ? ' locked' : '') + '">'
        + '<span class="dot" style="color:' + (hidden ? 'var(--neon)' : 'var(--muted)') + '">' + (hidden ? '◉' : '○') + '</span>'
        + iconHtml(pkg)
        + '<div class="info"><div class="pkg">' + esc(pkg) + '</div>'
        + '<div class="nice" dir="auto">' + esc(nice || '—') + tags + '</div></div>'
        + '<div class="acts">' + stopBtn + btn + '</div>'
        + '</div>';
}

/* =============================================================================
   (v3.14) الأيقونات — بلا جسر إطلاقاً
   -----------------------------------------------------------------------------
   سبب التغيير: في v3.13 كانت الأيقونات تُقرأ base64 عبر الجسر، وكان كل ضغطة
   تشغّل icons.sh لكل التطبيقات ثم readState (‏pm list packages) — فيبقى الجسر
   مشغولاً عشر ثوانٍ وتظهر رسالة «هناك عملية قيد التنفيذ».

   الحل: icons.sh يكتب الأيقونات في webroot هذه الواجهة نفسها + ملف فهرس
   icons/_index.txt، فتُقرأ الصور كملفات HTTP عادية — صفر استدعاءات للجسر.
   ولو تعذّر ذلك لأي سبب نعود تلقائياً مرة واحدة إلى الجسر (base64).
   ============================================================================= */
var icoSet = {};          // الحزم التي لها أيقونة فعلية (من الفهرس)
var icoMap = {};          // بديل base64
var icoMode = 'http';     // http | b64
var icoB64Tried = false;
var icoFails = 0;

function hueOf(pkg) {
    var hue = 0;
    for (var i = 0; i < pkg.length; i++) hue = (hue * 31 + pkg.charCodeAt(i)) % 360;
    return hue;
}

function avatarHtml(pkg) {
    var nice = nameOf(pkg) || pkg;
    var ch = (String(nice).trim().charAt(0) || '?').toUpperCase();
    return '<span class="avatar" style="background:hsl(' + hueOf(pkg) + ',60%,34%)">' + esc(ch) + '</span>';
}

function iconHtml(pkg) {
    if (icoMode === 'http' && icoSet[pkg]) {
        return '<img class="appic" src="icons/' + pkg + '.png" alt="" draggable="false" loading="lazy" '
            + 'onerror="falconIcoFail(this,\'' + pkg + '\')">';
    }
    if (icoMode === 'b64' && icoMap[pkg]) {
        return '<img class="appic" src="' + icoMap[pkg] + '" alt="" draggable="false">';
    }
    return avatarHtml(pkg);
}

/* استبدال الصورة الفاشلة بحرف ملوّن، ولو فشلت ثلاث صور نجرب مسار الجسر */
function falconIcoFail(img, pkg) {
    img.onerror = null;
    var nice = nameOf(pkg) || pkg;
    var span = document.createElement('span');
    span.className = 'avatar';
    span.style.background = 'hsl(' + hueOf(pkg) + ',60%,34%)';
    span.textContent = (String(nice).trim().charAt(0) || '?').toUpperCase();
    if (img.parentNode) img.parentNode.replaceChild(span, img);
    icoFails++;
    if (icoFails >= 3 && !icoB64Tried) { icoB64Tried = true; icoMode = 'b64'; loadIconsB64(); }
}

/* قراءة فهرس الأيقونات — طلب ملف عادي، لا يلمس الجسر ولا يُقفل شيئاً */
function loadIconIndex(after) {
    try {
        fetch('icons/_index.txt?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
            .then(function (txt) {
                var s = {};
                txt.split(/\r?\n/).forEach(function (l) {
                    l = l.trim();
                    if (l && l.charAt(0) !== '#') s[l] = true;
                });
                // لا نعيد الرسم إلا إذا تغيّرت المجموعة فعلاً — حتى لا يرتجف العرض
                var a = Object.keys(s).sort().join(',');
                var b = Object.keys(icoSet).sort().join(',');
                icoSet = s;
                icoMode = 'http';
                icoFails = 0;
                if (state.loaded && a !== b) render();
                if (after) after(true);
            })
            .catch(function () {
                if (icoB64Tried) { if (after) after(false); return; }
                icoB64Tried = true;
                icoMode = 'b64';
                loadIconsB64(after);
            });
    } catch (e) {
        if (!icoB64Tried) { icoB64Tried = true; icoMode = 'b64'; loadIconsB64(after); }
        else if (after) after(false);
    }
}

/* (v3.14) تحديث الفهرس تلقائياً بعد الإقلاع — طلبات ملفات صغيرة بلا جسر،
   فتظهر أيقونات الاستخراج التدريجي (الذي يجري في الخلفية عند الإقلاع). */
function pollIconIndex() {
    [5000, 15000, 30000, 60000, 120000].forEach(function (ms) {
        setTimeout(function () { loadIconIndex(); }, ms);
    });
}

/* احتياطي نادر: جلب الأيقونات base64 عبر الجسر — مرة واحدة فقط لكل جلسة */
function loadIconsB64(after) {
    if (!bridgeAvailable()) { if (after) after(false); return; }
    sh('export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'for F in /data/adb/falcon_icons/*.png; do [ -f "$F" ] || continue; echo "###$(basename "$F" .png)"; base64 "$F" 2>/dev/null; echo; done; echo ICONS_END',
        function (ec, out) {
            if (out === '__TIMEOUT__') { if (after) after(false); return; }
            var s = parseSections(out);
            var keys = Object.keys(s);
            for (var i = 0; i < keys.length; i++) {
                var b64 = (s[keys[i]] || []).join('').replace(/\s+/g, '');
                if (b64) icoMap[keys[i]] = 'data:image/png;base64,' + b64;
            }
            if (state.loaded) render();
            if (after) after(true);
        }, 45, true);
}

/* (v3.14) استخراج أيقونات حزم محددة فقط — منفصل تماماً عن الجسر:
   الأمر يسحب نفسه في الخلفية ويعود فوراً، فلا يُقفل الواجهة ولا يزاحم أي ضغطة */
function extractIconsDetached(pkgs) {
    if (!pkgs || !pkgs.length || !bridgeAvailable()) return;
    var uniq = {};
    pkgs.forEach(function (p) { uniq[stripBang(p)] = true; });
    var list = Object.keys(uniq).slice(0, 220);
    var args = list.map(function (p) { return "'" + p + "'"; }).join(' ');
    var cmd = 'export PATH=/system/bin:/system/xbin:/vendor/bin:$PATH; '
        + 'S=/data/adb/modules/playintegrityfix/icons.sh; [ -f "$S" ] || S=/data/adb/modules_update/playintegrityfix/icons.sh; '
        + 'if [ -f "$S" ]; then ( sh "$S" ' + args + ' >/dev/null 2>&1 & ) ; echo ICONS_STARTED; else echo ICONS_NOSCRIPT; fi';
    sh(cmd, function () {
        // الفهرس ملف HTTP عادي — تحديثه لا يكلّف الجسر شيئاً، فنكرّره بفواصل
        // قصيرة لتظهر الأيقونات تدريجياً دون أن ينتظر المستخدم شيئاً.
        setTimeout(function () { loadIconIndex(); }, 2500);
        if (list.length > 6) {
            setTimeout(function () { loadIconIndex(); }, 9000);
            setTimeout(function () { loadIconIndex(); }, 22000);
        }
    }, 12, true);
}

function renderSegs() {
    var segs = document.querySelectorAll('#segments button');
    for (var i = 0; i < segs.length; i++) {
        segs[i].className = (segs[i].getAttribute('data-f') === state.filter) ? 'on' : '';
    }
}

function render() {
    if (!state.loaded) return;
    buildInstalled();
    renderKpis();
    renderSegs();

    var hiddenSet = {};
    state.target.forEach(function (l) { hiddenSet[stripBang(l)] = true; });

    var q = $('q').value.trim().toLowerCase();
    var rows = [];
    var f = state.filter;

    if (f === 'hidden') {
        state.target.forEach(function (l) {
            rows.push({ pkg: stripBang(l), bang: (l.charAt(l.length - 1) === '!'), hidden: true });
        });
    } else if (f === 'installed') {
        state.all.forEach(function (p) {
            rows.push({ pkg: p, bang: false, hidden: !!hiddenSet[p] });
        });
        state.target.forEach(function (l) {
            var p = stripBang(l);
            if (installedMap && installedMap[p]) return;
            rows.push({ pkg: p, bang: (l.charAt(l.length - 1) === '!'), hidden: true });
        });
    } else if (f === 'user') {
        state.user.forEach(function (p) { rows.push({ pkg: p, bang: false, hidden: !!hiddenSet[p] }); });
    } else {
        var seen = {};
        state.target.forEach(function (l) {
            var p = stripBang(l);
            if (seen[p]) return; seen[p] = true;
            rows.push({ pkg: p, bang: (l.charAt(l.length - 1) === '!'), hidden: true });
        });
        state.all.forEach(function (p) {
            if (seen[p]) return; seen[p] = true;
            rows.push({ pkg: p, bang: false, hidden: false });
        });
    }

    if (q) {
        rows = rows.filter(function (r) {
            return r.pkg.toLowerCase().indexOf(q) !== -1
                || nameOf(r.pkg).toLowerCase().indexOf(q) !== -1
                || namesAll(r.pkg).indexOf(q) !== -1;
        });
    }

    rows.sort(function (a, b) { return a.pkg < b.pkg ? -1 : (a.pkg > b.pkg ? 1 : 0); });

    // (v3.14) نحفظ القائمة المعروضة حالياً ليستخدمها زرّ «تحديد الكل / إلغاء الكل»
    // فيعملان على ما يراه المستخدم بالضبط (نفس التصفية ونفس البحث).
    state.rows = rows;
    renderSelBar();

    var hiddenCount = 0;
    state.target.forEach(function (p) { if (p.charAt(p.length - 1) !== '!') hiddenCount++; });
    var visibleCount = 0;
    state.all.forEach(function (p) { if (!hiddenSet[p]) visibleCount++; });
    $('cHidden').textContent = String(hiddenCount);
    $('cInstalled').textContent = String(state.all.length);
    $('cAll').textContent = String(state.target.length + visibleCount);
    $('cUser').textContent = String(state.user.length);

    var html = '';
    if ((f === 'installed' || f === 'all') && state.all.length === 0) {
        html += '<div class="warnbar">' + t('warnNoPkgs') + '</div>';
    }
    var MAX = 700;
    var shown = 0;
    for (var i = 0; i < rows.length && shown < MAX; i++) {
        html += appRow(rows[i].pkg, rows[i].hidden, rows[i].bang);
        shown++;
    }
    if (shown === 0) html += '<div class="hint">' + esc(t('noResults')) + '</div>';
    if (rows.length > MAX) html += '<div class="hint">' + esc(tf('showingOf', { a: MAX, b: rows.length })) + '</div>';
    $('list').innerHTML = html;
}

var GW_SERVER = 'https://falcon-counter-server.onrender.com';
var gwDeviceId = null;
try { gwDeviceId = localStorage.getItem('falcon_device_id'); } catch (e) {}
if (!gwDeviceId) {
    gwDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9);
    try { localStorage.setItem('falcon_device_id', gwDeviceId); } catch (e) {}
}
function gwPing() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', GW_SERVER + '/ping', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        try { xhr.timeout = 6000; } catch (e) {}
        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4 || xhr.status !== 200) return;
            try {
                var data = JSON.parse(xhr.responseText);
                if (data && data.onlineUsers !== undefined) {
                    var el = document.getElementById('online-counter');
                    if (el) el.textContent = String(data.onlineUsers);
                }
            } catch (e) {}
        };
        xhr.send(JSON.stringify({ deviceId: gwDeviceId }));
    } catch (e) {}
}
