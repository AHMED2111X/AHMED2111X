name: Sync Keybox File

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Keybox
        env:
          API_KEY: ${{ secrets.KEYBOX_API_KEY }}
        run: |
          curl -s -H "x-api-key: $API_KEY" "https://keybox.tryigit.dev/api/clever..." -o temp_keybox.xml
          
          if [ -s temp_keybox.xml ]; then
            mv temp_keybox.xml keybox.xml
          else
            echo "خطأ: تعذر جلب ملف صالح من الخادم البعيد."
            exit 1
          fi

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add keybox.xml
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Keybox refreshed"
            git push
          else
            echo "لا توجد أي تغييرات جديدة في ملف Keybox."
          fi
