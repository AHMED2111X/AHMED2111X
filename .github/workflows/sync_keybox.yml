name: Auto Sync and Replace Keybox

on:
  schedule:
    # يعمل تلقائياً كل 5 دقائق
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-replace:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Overwrite Keybox
        run: |
          rm -f keybox.xml target_keybox.xml
          curl -sSL "https://keybox.tryigit.dev/keybox.xml" -o keybox.xml
          if [ ! -s keybox.xml ] || grep -q "<!DOCTYPE html>" keybox.xml; then
            curl -sSL "https://keybox.tryigit.dev/" -o keybox.xml
          fi

      - name: Commit and Push to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git rm --cached keybox.xml 2>/dev/null || true
          git add keybox.xml
          if git diff --cached --quiet; then
            echo "لا يوجد تحديث جديد."
          else
            git commit -m "auto: replace keybox with latest"
            git push
          fi
